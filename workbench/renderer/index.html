<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Metatrooper</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="rail">
    <div class="rail-top">
      <select id="project-pick" data-action="project-pick" title="Project"></select>
      <button class="link" data-action="open-folder" title="Open a project folder">Open</button>
      <span id="core"></span>
    </div>
    <div id="gates"></div>
    <div id="sessions" class="sessions"></div>
    <div id="launch" class="launch"></div>
  </aside>

  <main class="work">
    <header id="term-head" class="term-head"></header>
    <div id="centre" class="centre"></div>
    <div id="start" class="start" hidden></div>
  </main>

  <section class="side-split" id="split">
    <nav class="tabs" id="tabs"></nav>
    <div id="view" class="view"></div>
  </section>

  <footer id="strip" class="strip"></footer>

  <div id="palette" class="palette" hidden>
    <input id="palette-input" placeholder="Switch agent, run an action, open a tab, change theme" autocomplete="off" spellcheck="false">
    <div id="palette-list" class="palette-list"></div>
  </div>

  <div id="inbox" class="inbox" hidden><div class="head">Inbox</div><div id="inbox-list" class="palette-list"></div></div>
  <div id="menu" class="menu" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="diff.js"></script>
  <script src="terminal.js"></script>
  <script src="panes.js"></script>
  <script src="app.js"></script>
</body>
</html>
