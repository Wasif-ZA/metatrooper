<!doctype html>
<html lang="en" data-look="dither">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Ouros</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="wall.css">
  <link rel="stylesheet" href="frame.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="browser.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="review.css">
  <link rel="stylesheet" href="wall-plain.css">
  <link rel="stylesheet" href="ui.bundle.css">
</head>
<body class="ind-spark">
  <aside class="frame" id="frame" aria-label="Sidebar">
    <div class="fhead"><span class="brand" id="brand" data-icon="mark1" title="Ouros" role="img" aria-label="Ouros"></span><button class="ftog" id="frameTog" data-frame-toggle title="Collapse sidebar (Ctrl+B)" aria-label="Collapse sidebar" aria-expanded="true"><span data-icon="panel"></span></button></div>
    <div class="fnew"><button data-action="launch-menu" title="Start an agent or a terminal" aria-label="New"><span class="fi" data-icon="plus"></span><span class="fl">New</span></button></div>
    <nav class="vseg fnav" role="group" aria-label="View"><button data-action="view" data-view="home" aria-pressed="false" title="Home" aria-label="Home"><span class="fi" data-icon="home"></span><span class="fl">Home</span></button><button data-action="view" data-view="ide" aria-pressed="false" title="IDE" aria-label="IDE"><span class="fi" data-icon="code"></span><span class="fl">IDE</span></button><button data-action="view" data-view="wall" aria-pressed="true" title="Wall" aria-label="Wall"><span class="fi" data-icon="wall"></span><span class="fl">Wall</span></button><button data-action="view" data-view="inbox" aria-pressed="false" title="Needs you" aria-label="Needs you"><span class="fi" data-icon="inbox"></span><span class="fl">Needs you</span><span class="fpill" id="frameNeeds" hidden></span></button></nav>
    <div class="fsec">Agents</div>
    <div class="fagents" id="frame-agents"></div>
    <div class="ffoot"><button data-action="view" data-view="addons" title="Add-ons" aria-label="Add-ons"><span class="fi" data-icon="addOns"></span><span class="fl">Add-ons</span></button><button data-action="report-issue" title="Report issue on GitHub" aria-label="Report issue"><span class="fi" data-icon="flag"></span><span class="fl">Report issue</span></button><button data-action="settings" title="Settings" aria-label="Settings"><span class="fi" data-icon="settings"></span><span class="fl">Settings</span></button></div>
  </aside>
  <header class="title">
    <button class="ib" id="listBtn" data-action="list" title="Agent list" aria-label="Agent list" aria-pressed="false"><span data-icon="listView"></span></button>
    <span class="crumb"><button id="project-pick" class="proj kpick" data-action="project-menu" title="Switch project"></button><span id="branch" class="branch" hidden></span></span>
    <button class="chip needs" id="needs" data-action="inbox" title="Jump to the longest wait: Alt+J" hidden><span class="n roll" id="needsN"><span>0</span></span>need you</button>
    <span class="sp"></span>
    <span class="usage" id="usage" hidden></span>
    <button class="ib" data-action="palette" title="Search (Ctrl+K)" aria-label="Search"><span data-icon="search"></span></button>
    <span id="core" class="core"></span>
    <span id="newagent" class="newagent"></span>
  </header>

  <div id="stage" class="stage">
    <main id="centre" class="wall"></main>
    <div id="start" class="start" hidden></div>
    <footer id="strip" class="strip"><span id="strip-needs"></span><span id="strip-info" class="task"></span><button class="stab" data-action="tab" data-tab="diff">Diff<span class="n" id="diffN"></span></button><button class="stab" data-action="tab" data-tab="git">Git</button><button class="stab" data-action="tab" data-tab="handback">Hand back</button><button class="stab" data-action="tab" data-tab="browser">Browser</button></footer>

    <section class="side-split" id="split">
      <nav class="tabs" id="tabs"></nav>
      <div id="view" class="view"></div>
    </section>

    <div class="scrim" data-action="list"></div>
    <aside class="alist" id="list" aria-label="Agents"></aside>
    <section class="sheet" id="sheet"><div class="tab" id="sheet-tab" data-action="sheet" role="button" tabindex="0" aria-expanded="false"><span class="n roll" id="sheetN"><span>0</span></span><span class="t" id="sheetT"></span><span class="runs" id="sheetRuns"></span><span class="ga" id="sheetAct"></span><span class="chev"><svg width="10" height="10"><path d="M2 6.5L5 3.5 8 6.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span></div><div class="gates" id="gates"></div></section>
  </div>

  <div class="search" id="search" role="search">
    <div class="sbar"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5L13 13"/></svg><input id="palette-input" placeholder="Search agents and commands" autocomplete="off" spellcheck="false"><kbd>Ctrl</kbd><kbd>K</kbd></div>
    <div id="palette" class="palette" hidden>
      <div id="palette-list" class="res palette-list"></div>
      <div class="sfoot"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <div id="inbox" class="inbox" role="dialog" aria-label="Inbox" hidden><div class="head">Inbox</div><div id="inbox-list" class="palette-list"></div></div>
  <div id="sinks" class="inbox" role="dialog" aria-label="Notification sinks" hidden><div class="head">Notification sinks</div><div id="sinks-list" class="palette-list"></div></div>
  <section id="home" class="home" aria-label="Home" hidden></section>
  <section id="ide" class="ide" aria-label="IDE" hidden></section>
  <section id="addons" class="home" aria-label="Add-ons" hidden></section>
  <section id="needsview" class="home" aria-label="Needs you" hidden></section>
  <section id="settings" class="settings" role="dialog" aria-label="Settings" tabindex="-1" hidden></section>
  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="diff.js"></script>
  <script src="terminal.js"></script>
  <script src="wall.js"></script>
  <script src="browser-chrome.js"></script>
  <script src="home.js"></script>
  <script src="frame.js"></script>
  <script src="app.js"></script>
  <script src="ui.bundle.js"></script>
</body>
</html>
