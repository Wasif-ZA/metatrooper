name: Bug report
description: Something in MetaTrooper does not work as the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through SECURITY.md, not here. Remove tokens, keys and private paths before you paste anything.
  - type: input
    id: version
    attributes:
      label: MetaTrooper version
      description: The version in the installer name, or `version` in core/package.json for a source install
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: For example Windows 11 24H2, or Ubuntu 24.04 (Linux is beta)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The steps, the engine (claude, codex, agy), and the pipeline if one was running
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt, secrets removed
      description: From `~/.metatrooper/logs/` (core.log, workbench.log, event-errors.log, plugin-output.log). Ctrl+K, "Open logs folder" opens it
      render: text
    validations:
      required: true
