# metarouter (router/) goes to PyPI on a router-v* tag, separate from the desk's v* releases.
name: router-publish

on:
  push:
    tags: ['router-v*']

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
        working-directory: router
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: router/dist/
