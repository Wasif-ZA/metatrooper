[project]
name = "metarouter"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
metarouter = "metarouter.cli:entry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["metarouter", "metarouter.recipes", "metarouter.browse"]

[tool.setuptools.package-data]
metarouter = ["mcp_catalog.json", "filters/*.json", "packs/*.json"]
"metarouter.recipes" = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
