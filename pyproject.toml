[project]
name = "toolrouter"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
toolrouter = "toolrouter.cli:entry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["toolrouter", "toolrouter.recipes", "toolrouter.browse"]

[tool.setuptools.package-data]
toolrouter = ["mcp_catalog.json"]
"toolrouter.recipes" = ["catalog.json"]
